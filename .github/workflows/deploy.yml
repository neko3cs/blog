name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CMS で続けて保存したとき、古い版が新しい版を上書きしないようにする。
# デプロイ中の実行は止めず、待っている実行は最新のものだけを残す。PR のビルドは古いものを止める。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # サードパーティの Action は、タグではなくコミットの SHA で固定する
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 管理画面（Sveltia CMS）で書いた記事の入力ミスを、公開する前に見つける（Issue #20）
      - run: pnpm check:frontmatter

      - run: pnpm test:cms-auth

      - run: pnpm build

      # PR ではここまで（検査とビルドが通ること）だけを確かめる。Secrets は使わない
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 管理画面の GitHub ログインの受け口。GITHUB_CLIENT_ID と GITHUB_CLIENT_SECRET は Worker の Secret に登録済みのものを使う
      - name: Deploy the CMS auth worker
        if: github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy --config workers/cms-auth/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
